# Panel admin Pages CMS (https://app.pagescms.org)
# Log masuk dengan GitHub, pilih repo ini, kemudian buka "Aktiviti Terkini" atau "Soal Jawab".
media:
  input: images/aktiviti
  output: /images/aktiviti
  categories: [image]
  rename: safe

content:
  - name: aktiviti
    label: Aktiviti Terkini
    description: Posting yang dipaparkan dalam bahagian "Aktiviti Terkini" di nazieraaziz.com. Posting terbaru (ikut tarikh) dipaparkan dahulu.
    type: file
    path: data/aktiviti.json
    format: json
    list: true
    fields:
      - name: tarikh
        label: Tarikh
        type: date
        required: true
      - name: tajuk
        label: Tajuk
        type: string
        required: true
      - name: cerita
        label: Cerita
        description: Tulis seperti biasa. Tinggalkan satu baris kosong untuk perenggan baharu.
        type: text
      - name: gambar
        label: Gambar
        description: Boleh pilih beberapa gambar sekali gus (sehingga 12). Gambar pertama menjadi gambar utama.
        type: image
        options:
          multiple:
            max: 12
      - name: tajuk_en
        label: Tajuk (English, pilihan)
        description: Kosongkan jika tiada. Laman versi English akan guna tajuk BM.
        type: string
      - name: cerita_en
        label: Cerita (English, pilihan)
        description: Kosongkan jika tiada. Laman versi English akan guna cerita BM.
        type: text
  - name: soaljawab
    label: Soal Jawab
    description: Soalan pelawat sampai ke e-mel nazieraaziz92@gmail.com. Untuk menjawab secara awam, tambah item di sini (salin soalan, tulis jawapan). Hanya item yang ada jawapan dan bertanda "Paparkan" dipaparkan di laman. Jangan masukkan nama atau e-mel penanya.
    type: file
    path: data/soaljawab.json
    format: json
    list: true
    fields:
      - name: tarikh
        label: Tarikh dijawab
        type: date
        required: true
      - name: soalan
        label: Soalan
        description: Boleh dikemaskan sedikit (ejaan, buang maklumat peribadi) sebelum diterbitkan.
        type: text
        required: true
      - name: jawapan
        label: Jawapan
        description: Tinggalkan satu baris kosong untuk perenggan baharu. Soalan tanpa jawapan tidak dipaparkan.
        type: text
      - name: paparkan
        label: Paparkan di laman
        description: Buang tanda untuk sembunyikan sementara tanpa memadam.
        type: boolean
        default: true
      - name: soalan_en
        label: Soalan (English, pilihan)
        type: text
      - name: jawapan_en
        label: Jawapan (English, pilihan)
        type: text
