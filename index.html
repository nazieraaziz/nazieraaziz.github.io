<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coming Soon</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500&display=swap">
<style>
  :root { --bg:#F7F3F4; --ink:#2A2226; --muted:#7A6B72; --accent:#8E4B63; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1A1518; --ink:#F1E9EC; --muted:#A8979F; --accent:#E3A5BB; color-scheme: dark; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:400 1.0625rem/1.6 "Figtree", system-ui, sans-serif;
         display:grid; place-items:center; padding:2rem max(16px, 5vw); }
  main { max-width: 34rem; display:grid; gap:1.25rem; }
  .eyebrow { font-size:.75rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  h1 { font-family:"DM Serif Display", Georgia, serif; font-weight:400; font-size:clamp(2.5rem, 9vw, 4rem); line-height:1.05; margin:0; text-wrap:balance; }
  p { margin:0; color:var(--muted); }
  .rule { width:3rem; height:2px; background:var(--accent); }
</style>
</head>
<body>
  <main>
    <span class="eyebrow">nazieraaziz.github.io</span>
    <h1>A new website is on its way.</h1>
    <div class="rule"></div>
    <p>This page is being prepared. Please check back soon.</p>
  </main>
</body>
</html>
